[resolution]
	maximum_height=700
	maximum_width=900
	[tooltip]
		id="tooltip_large"
	[/tooltip]
	[helptip]
		id="tooltip_large"
	[/helptip]
	[grid]
		[row]
			[column]
				border="right"
				border_size=10
				horizontal_grow=yes
				vertical_grow=yes
				[grid]
					[row]
						[column]
							[label]
								label="<big>Preview</big>"
								use_markup=yes
							[/label]
						[/column]
					[/row]
					[row]
						[column]
							[image]
								id="the_image"
								label="units/drakes/inferno.png"
							[/image]
						[/column]
					[/row]
					[row]
						[column]
							border="top,bottom"
							border_size=10
							grid_width=3
							horizontal_alignment="center"
							[grid]
								[row]
									[column]
										[toggle_button]
											id="chk_faction"
											label="Whole Faction"
											tooltip="Apply to all units and recruits of this faction"
										[/toggle_button]
									[/column]
									[column]
										[spacer]
											width=10
										[/spacer]
									[/column]
									[column]
										[toggle_button]
											id="chk_ut"
											label="Unit Type only"
											tooltip="Apply to all units of this unit type"
										[/toggle_button]
									[/column]
								[/row]
							[/grid]
						[/column]
					[/row]
					[row]
						[column]
							grow_factor=1
							horizontal_alignment="center"
							vertical_alignment="center"
							[grid]
								[row]
									[column]
										vertical_alignment="top"
										[label]
											label="<b>Body Parts</b>"
											use_markup=yes
										[/label]
									[/column]
								[/row]
								[row]
									[column]
										border="all"
										border_size=5
										horizontal_grow=yes
										vertical_grow=yes
										[listbox]
											id="list_parts"
											[list_definition]
												[row]
													[column]
														grow_factor=1
														horizontal_grow=yes
														vertical_grow=yes
														[toggle_panel]
															[grid]
																[row]
																grow_factor=1
																[column]
																border="all"
																border_size=5
																horizontal_alignment="left"
																[label]
																id="lbl_part"
																[/label]
																[/column]
																[/row]
															[/grid]
														[/toggle_panel]
													[/column]
												[/row]
											[/list_definition]
										[/listbox]
									[/column]
								[/row]
							[/grid]
						[/column]
					[/row]
					[row]
						[column]
							[spacer]
								height=20
							[/spacer]
						[/column]
					[/row]
					[row]
						[column]
							border="top"
							border_size=10
							grid_width=3
							horizontal_alignment="center"
							vertical_alignment="bottom"
							[grid]
								[row]
									[column]
										[button]
											definition="large"
											id="ok"
											label="Apply"
											return_value=1
										[/button]
									[/column]
								[/row]
								[row]
									[column]
										[spacer]
											height=10
										[/spacer]
									[/column]
								[/row]
								[row]
									[column]
										[button]
											id="cancel"
											label="Cancel"
										[/button]
									[/column]
								[/row]
								[row]
									[column]
										[spacer]
											height=10
										[/spacer]
									[/column]
								[/row]
							[/grid]
						[/column]
					[/row]
				[/grid]
			[/column]
			[column]
				grow_factor=1
				horizontal_alignment="left"
				vertical_alignment="top"
				[grid]
					[row]
						[column]
							[label]
								label="<b>Colors</b>"
								use_markup=yes
							[/label]
						[/column]
					[/row]
					[row]
						[column]
							border="all"
							border_size=5
							horizontal_grow=yes
							vertical_grow=yes
							[listbox]
								id="list_variants"
								vertical_scrollbar_mode="always"
								[list_definition]
									[row]
										[column]
											grow_factor=1
											horizontal_grow=yes
											vertical_grow=yes
											[toggle_panel]
												[grid]
													[row]
														grow_factor=1
														[column]
															border="all"
															border_size=5
															horizontal_alignment="left"
															[image]
																id="lbl_image"
															[/image]
														[/column]
														[column]
															border="all"
															border_size=5
															horizontal_alignment="left"
															[stacked_widget]
																definition="default"
																[layer]
																[row]
																[column]
																[spacer]
																definition="default"
																height=5
																width=150
																[/spacer]
																[/column]
																[/row]
																[/layer]
																[layer]
																[row]
																grow_factor=1
																[column]
																grow_factor=1
																horizontal_grow=true
																vertical_grow=true
																[label]
																id="lbl_variant"
																[/label]
																[/column]
																[/row]
																[/layer]
															[/stacked_widget]
														[/column]
													[/row]
												[/grid]
											[/toggle_panel]
										[/column]
									[/row]
								[/list_definition]
							[/listbox]
						[/column]
					[/row]
				[/grid]
			[/column]
		[/row]
	[/grid]
[/resolution]
